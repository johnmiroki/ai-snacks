<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not on the shelf — AI Snacks</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='54' font-size='74' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%8D%A1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ground:#F6F7FA; --ink:#15171E; --muted:#5B6172; --faint:#8B91A3; --accent:#3F4FC0;
    --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#0F1117; --ink:#EEF0F6; --muted:#969DB0; --faint:#6E7689; --accent:#8E9AF2; }
  }
  :root[data-theme="dark"] { --ground:#0F1117; --ink:#EEF0F6; --muted:#969DB0; --faint:#6E7689; --accent:#8E9AF2; }
  :root[data-theme="light"] { --ground:#F6F7FA; --ink:#15171E; --muted:#5B6172; --faint:#8B91A3; --accent:#3F4FC0; }

  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  main { max-width:44ch; padding:24px; }
  p.code {
    margin:0 0 12px; font-family:var(--mono); font-size:11px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
  }
  h1 {
    margin:0 0 12px; font-family:var(--mono); font-weight:600;
    font-size:clamp(24px,4vw,34px); letter-spacing:-.02em; line-height:1.15;
  }
  p.msg { margin:0 0 20px; color:var(--muted); }
  a {
    font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor;
    padding-bottom:2px;
  }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Nothing on that shelf.</h1>
  <p class="msg">That page either moved or never existed. The rest of the collection is still here.</p>
  <a href="/ai-snacks/">&#8592; Back to AI Snacks</a>
</main>
</body>
</html>
