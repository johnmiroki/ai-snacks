<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ground:#F6F7FA; --surface:#FFFFFF; --ink:#15171E; --muted:#5B6172; --faint:#8B91A3;
    --rule:#E0E3EC; --accent:#3F4FC0;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    width:1200px; height:630px; background:var(--ground); color:var(--ink);
    font-family:var(--mono); display:flex; flex-direction:column;
    padding:64px 72px; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow {
    font-size:19px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint);
    display:flex; align-items:center; gap:14px;
  }
  .eyebrow i { flex:1 1 auto; height:1px; background:var(--rule); font-style:normal; }

  h1 { margin-top:40px; font-size:104px; font-weight:600; letter-spacing:-.04em; line-height:1; }
  h1 .dot { color:var(--accent); }
  p.sub { margin-top:28px; font-size:26px; line-height:1.5; color:var(--muted); max-width:30ch; }
  p.sub b { color:var(--ink); font-weight:600; }

  .shelf { margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .row {
    background:var(--surface); border:1px solid var(--rule);
    border-left:3px solid var(--accent); border-radius:4px;
    padding:16px 22px; display:flex; align-items:baseline; gap:18px;
  }
  .row .t { font-size:23px; font-weight:600; color:var(--accent); }
  .row .m { font-size:17px; color:var(--faint); letter-spacing:.06em; margin-left:auto; }
  .row.ghost {
    border-style:dashed; border-left-style:dashed; border-left-color:var(--rule);
    background:transparent; color:var(--faint); font-size:18px; letter-spacing:.06em;
  }
  .foot { margin-top:26px; font-size:19px; color:var(--accent); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="eyebrow"><span>johnmiroki</span><i></i><span>One page, one file</span></div>

  <h1>AI Snacks<span class="dot">.</span></h1>
  <p class="sub">Reference pages for AI tools, <b>checked against the tool</b> rather than its docs.</p>

  <div class="shelf">
    <div class="row">
      <span class="t">Claude Code Command Index</span>
      <span class="m">143 commands &middot; 57 flags</span>
    </div>
    <div class="row ghost">More on the shelf soon</div>
  </div>

  <div class="foot">johnmiroki.github.io/ai-snacks</div>
</body>
</html>
